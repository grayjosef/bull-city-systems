<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient: charcoal to deep navy -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0D11"/>
      <stop offset="0.55" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#14181F"/>
    </linearGradient>

    <!-- Subtle blueprint grid -->
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#3D6E94" stroke-width="0.5" opacity="0.12"/>
    </pattern>

    <!-- Brass accent gradient -->
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8932E"/>
      <stop offset="1" stop-color="#B68B4C"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Top hairline schematic -->
  <g stroke="#3D6E94" stroke-width="1" opacity="0.35" fill="none">
    <line x1="60" y1="60" x2="1140" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="80"/>
    <line x1="1140" y1="60" x2="1140" y2="80"/>
    <line x1="600" y1="60" x2="600" y2="78"/>
  </g>

  <!-- Top eyebrow text — coordinates and section number -->
  <g font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace" fill="#ECE5D6" opacity="0.55">
    <text x="60" y="108" font-size="14" letter-spacing="3.5">35.9940° N · 78.8986° W · DURHAM, NC</text>
    <text x="1140" y="108" font-size="14" letter-spacing="3.5" text-anchor="end">EST. 2026 · ARC &amp; ANCHOR</text>
  </g>

  <!-- Brass accent rule -->
  <line x1="60" y1="180" x2="180" y2="180" stroke="url(#brass)" stroke-width="3"/>

  <!-- Section number -->
  <text x="60" y="170" font-family="'Big Shoulders Display', sans-serif" font-size="28" fill="#C8932E" letter-spacing="3" font-weight="600">01 · TECHNICAL STUDIO</text>

  <!-- Main display headline -->
  <text x="60" y="285" font-family="'Big Shoulders Display', sans-serif" font-size="96" font-weight="700" fill="#ECE5D6" letter-spacing="-1">BULL CITY</text>
  <text x="60" y="385" font-family="'Big Shoulders Display', sans-serif" font-size="96" font-weight="700" fill="#ECE5D6" letter-spacing="-1">SYSTEMS</text>

  <!-- Tagline -->
  <text x="60" y="445" font-family="'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif" font-size="26" fill="#D9CFBC" font-weight="400" letter-spacing="0.2">
    Industrial-strength IT, websites, and automation
  </text>
  <text x="60" y="481" font-family="'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif" font-size="26" fill="#D9CFBC" font-weight="400" letter-spacing="0.2">
    for Durham and the Triangle.
  </text>

  <!-- Trust strip — bottom -->
  <line x1="60" y1="540" x2="1140" y2="540" stroke="#3D6E94" stroke-width="1" opacity="0.35"/>
  <g font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace" fill="#ECE5D6" opacity="0.7" font-size="14" letter-spacing="2.5">
    <text x="60" y="580">VETERAN-OWNED</text>
    <text x="270" y="580" fill="#C8932E">·</text>
    <text x="290" y="580">DURHAM-BASED</text>
    <text x="490" y="580" fill="#C8932E">·</text>
    <text x="510" y="580">FLAT-FEE OPTIONS</text>
    <text x="730" y="580" fill="#C8932E">·</text>
    <text x="750" y="580">PRECISION FIRST</text>
  </g>

  <!-- Right side: Durham flag, scaled -->
  <g transform="translate(840 180)">
    <!-- Drop shadow -->
    <rect x="3" y="6" width="280" height="182" fill="#000" opacity="0.4"/>
    <!-- Flag -->
    <rect x="0" y="0" width="280" height="182" fill="#1F4A8A"/>
    <rect x="175" y="0"   width="105" height="60.7" fill="#B83A28"/>
    <rect x="175" y="60.7" width="105" height="60.7" fill="#ECE5D6"/>
    <rect x="175" y="121.4" width="105" height="60.7" fill="#C8932E"/>
    <!-- Stars (Pleiades) -->
    <g fill="#ECE5D6">
      <!-- Approximated 5-point stars as small circles for crispness at this scale -->
      <circle cx="64" cy="58" r="7"/>
      <circle cx="105" cy="44" r="6"/>
      <circle cx="44" cy="93" r="5"/>
      <circle cx="93" cy="91" r="7"/>
      <circle cx="134" cy="79" r="5"/>
      <circle cx="70" cy="128" r="6"/>
      <circle cx="122" cy="134" r="5"/>
    </g>
    <rect x="0.5" y="0.5" width="279" height="181" fill="none" stroke="#0B0D11" stroke-width="1"/>
  </g>

  <!-- Bottom right — domain mark -->
  <text x="1140" y="580" font-family="'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace" font-size="14" fill="#ECE5D6" opacity="0.85" letter-spacing="2" text-anchor="end" font-weight="500">
    BULLCITYSYSTEMS.COM
  </text>
</svg>
